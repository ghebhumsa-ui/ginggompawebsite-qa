<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access | Sangchen Thongdrol Ling</title>

    <style>
        body {
            margin: 0;
            font-family: "Georgia", serif;
            color: #f5e6c8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(44,10,10,0.75), rgba(90,15,15,0.75)),
                        url('assets/images/monastery.jpg') center/cover no-repeat;
            filter: blur(6px);
            z-index: -1;
        }

        .login-container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            max-width: 320px;
        }

        .monastery-name {
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #d4af37;
        }

        .subtitle {
            font-size: 13px;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: transparent;
            color: #f5e6c8;
            outline: none;
            text-align: center;
        }

        input::placeholder {
            color: rgba(245, 230, 200, 0.6);
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #d4af37;
            color: #3b0b0b;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #c19b2e;
        }

        .note {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="monastery-name">Sangchen Thongdrol Ling</div>
        <div class="subtitle">Private Preview Access</div>

        <input type="password" id="pass" placeholder="Enter password">
        <button onclick="check()">Enter</button>

        <div class="note">Access provided for review purposes only</div>
    </div>

<script>
function check() {
    const p = document.getElementById("pass").value;
    if (p === "ging123") {
        window.location.href = "/index.html";
    } else {
        alert("Incorrect password");
    }
}
</script>
</body>
</html>
